{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil</title>
    <link rel="stylesheet" href="{% static 'polls/css/perfil.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="shortcut icon" type="imagex/png" href="{% static 'polls/images/logo.ico'%}">
</head>
<body>
    <div class="header">
        <a href="{% url 'polls:index' %}">
        <span class="icon home-icon"><i class="bi bi-house-heart-fill"></i></span>
    </a>
        <span class="icon info-icon"><i class="bi bi-info-circle-fill"></i></span>
    </div>
    <div class="container">
        

        <div class="profile">
            <div class="perfil-icon">
                <i class="bi bi-person-circle"></i>
        </div>
            {% if user.is_authenticated %}
          <span class="text">  Bem vindo(a) {{ user.nome }}!</span>
            {% else %}
          <p>You are not logged in</p>
          {% endif %}

        </div>

        <div class="actions">
            <a href="#"><span><i class="bi bi-pencil-square"></i></span> Alterar Senha</a>
            <a href="#"><span><i class="bi bi-pencil-square"></i></span> Endereço</a>
            <a href="{% url 'usuarios:sair' %}" class="logout"><span><i class="bi bi-box-arrow-right"></i></span> Sair da conta</a>
            <a href="#" class="delete"><span><i class="bi bi-trash3"></i></span> Excluir conta</a>
        </div>
    </div>
</body>
</html>
