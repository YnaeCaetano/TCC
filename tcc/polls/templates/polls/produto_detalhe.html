
{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Produto</title>
    <link rel="stylesheet" href="{% static 'polls/css/produto_detalhe.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="shortcut icon" type="imagex/png" href="{% static 'polls/images/logo.ico'%}">    
</head>
<body>
    <div class="produto-container">
        <div class="produto-imagem">
            <img src="{% static 'polls/images/baiano.jpg'%}" alt="Bonecas de cerâmica">
        </div>
        <div class="produto-detalhes">
            <h1>Boneca de cerâmica</h1>
            <p class="avaliacao">4.9 <span class="estrelas">★★★★★</span><a href="#" class="reportar">&#9888; Reportar</a></p>
            <p><strong>Cor:</strong>
                <button class="cor">Rosa</button>
                <button class="cor">Preto</button>
                <button class="cor">Amarelo</button>
            </p>
            <p><strong>Quantidade:</strong>
                <button class="quantidade">-</button>
                <span class="quantidade-numero">1</span>
                <button class="quantidade">+</button>
            </p>
            <button class="comprar">Compre agora</button>
            <button class="carrinho"><span class="icone">🛒</span> Adicionar ao carrinho</button>
        </div>
    </div>
</body>
</html>
